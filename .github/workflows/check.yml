name: Validate portfolio package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:demo
      - run: git diff --exit-code -- demo/index.html
      - run: npm run check
      - run: npm test
